name: CI

permissions:
  contents: read
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          cache: pip
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint with ruff (critical errors)
        run: |
          ruff check . --select E9,F63,F7,F82 --output-format=text

      - name: Lint with ruff (full)
        run: |
          ruff check . --statistics

      - name: Format check with ruff
        run: |
          ruff format --check .

  lint-and-test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          cache: pip
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v7
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          python -c "import nltk; nltk.download('vader_lexicon', quiet=True)"

      - name: Run pre-commit checks
        uses: pre-commit/action@v3.0.0
        # BLOCKING — no continue-on-error

      - name: Run dependency vulnerability scan
        run: |
          pip install pip-audit
          pip-audit --desc on -r requirements.txt
        continue-on-error: true  # Advisory only; not blocking

      - name: Run tests with pytest (coverage threshold)
        run: |
          python -m pytest tests/ -v \
            --cov=src/tamasha \
            --cov=api \
            --cov-config=pyproject.toml \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=70

      - name: Upload coverage report
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  docker-build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: tamasha:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-audit:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          cache: pip
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit
      - name: Audit dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt

  bandit:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          cache: pip
          python-version: "3.11"
      - name: Install security tools
        run: pip install bandit
      - name: Run bandit security scan
        run: bandit -r src/ -ll

  hadolint:
    name: Container lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

  typecheck:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          cache: pip
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy
      - name: Type check with mypy
        run: mypy . --ignore-missing-imports

  schemathesis-fuzz:
    name: Contract fuzzing (Schemathesis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || pip install -e ".[dev]" 2>/dev/null || true
          pip install schemathesis
      - name: Generate OpenAPI spec
        run: |
          python -c "
          from api.main import app
          import json, sys
          with open('/tmp/openapi.json', 'w') as f:
              json.dump(app.openapi(), f, indent=2)
          print('OpenAPI spec generated:', len(json.dumps(app.openapi())), 'bytes')
          "
      - name: Fuzz API against OpenAPI contract
        run: |
          uvicorn api.main:app --host 0.0.0.0 --port 8000 &
          sleep 3
          st run --checks all /tmp/openapi.json --base-url http://localhost:8000 -w 5 --hypothesis-suppress-health-check=too_slow 2>&1 | tail -20 || true
