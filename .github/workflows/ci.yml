# Cancel superseded runs of this workflow on the same ref (PR pushes).
# Never cancels on main pushes or scheduled runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

name: CI

permissions:
  contents: read
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          cache: pip
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.16.4

      - name: Lint with ruff (critical errors)
        run: |
          ruff check . --select E9,F63,F7,F82 --output-format=concise

      - name: Lint with ruff (full)
        run: |
          ruff check . --statistics

      - name: Format check with ruff
        run: |
          ruff format --check .

  lint-and-test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          cache: pip
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          python -c "import nltk; nltk.download('vader_lexicon', quiet=True)"

      - name: Run pre-commit checks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        # BLOCKING — no continue-on-error

      - name: Run dependency vulnerability scan
        run: |
          pip install pip-audit
          pip-audit --desc on -r requirements.txt
        continue-on-error: true  # Advisory only; not blocking

      - name: Run tests with pytest (coverage threshold)
        run: |
          python -m pytest tests/ -v \
            --cov=src/tamasha \
            --cov=api \
            --cov-config=pyproject.toml \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=70

      - name: Upload coverage report
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  docker-build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: tamasha:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-audit:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          cache: pip
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit
      - name: Audit dependencies for known vulnerabilities
        # PYSEC-2026-2447 (diskcache pickle deserialization) has no upstream fix
        # as of 2026-09-27 (OSV last_affected 5.6.3); diskcache is a runtime dep
        # (src/tamasha/cache.py) and cache entries are written only by our own
        # code. Ignore until a patched release exists.
        # PYSEC-2026-3740 (nltk) has no upstream fix release yet.
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-2447 --ignore-vuln PYSEC-2026-3740

  bandit:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          cache: pip
          python-version: "3.11"
      - name: Install security tools
        run: pip install bandit==1.9.4
      - name: Run bandit security scan
        run: bandit -r src/ -ll

  hadolint:
    name: Container lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
          ignore: DL3066

  typecheck:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          cache: pip
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy==1.15.0
      - name: Type check with mypy
        run: mypy . --ignore-missing-imports

  schemathesis-fuzz:
    name: Contract fuzzing (Schemathesis)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install schemathesis
      - name: Generate OpenAPI spec
        env:
          PYTHONPATH: src:.
        run: |
          python -c "
          from api.main import app
          import json, sys
          with open('/tmp/openapi.json', 'w') as f:
              json.dump(app.openapi(), f, indent=2)
          print('OpenAPI spec generated:', len(json.dumps(app.openapi())), 'bytes')
          "
      - name: Fuzz API against OpenAPI contract
        env:
          PYTHONPATH: src:.
        run: |
          uvicorn api.main:app --host 0.0.0.0 --port 8000 &
          sleep 3
          st run --checks all /tmp/openapi.json --base-url http://localhost:8000 -w 5 --hypothesis-suppress-health-check=too_slow 2>&1 | tail -20 || true
